<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 8" />

  <!-- Central Speech Waveform Icon -->
  <g transform="translate(256, 256)">
    <!-- Burmese Character "အ" or Audio Waveform -->
    <!-- Sound Waves bars -->
    <rect x="-140" y="-30" width="16" height="60" rx="8" fill="url(#accent-grad)" opacity="0.75" />
    <rect x="-105" y="-60" width="16" height="120" rx="8" fill="url(#accent-grad)" opacity="0.9" />
    <rect x="-70" y="-95" width="16" height="190" rx="8" fill="url(#gold-grad)" filter="url(#glow)" />
    
    <!-- Central Main Golden Mic / Speaker Emblem -->
    <circle cx="0" cy="0" r="54" fill="url(#gold-grad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="44" fill="#0f172a" />
    <!-- Myanmar Letter "အ" (Ah - Sound of Speech) stylized -->
    <path d="M-14 -12 C-14 -22, 14 -22, 14 -10 C14 2, -2 6, 2 18 M-8 8 L12 8" 
          stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="2" cy="18" r="3" fill="#fcd34d" />

    <!-- Right Sound Waves bars -->
    <rect x="54" y="-95" width="16" height="190" rx="8" fill="url(#gold-grad)" filter="url(#glow)" />
    <rect x="89" y="-60" width="16" height="120" rx="8" fill="url(#accent-grad)" opacity="0.9" />
    <rect x="124" y="-30" width="16" height="60" rx="8" fill="url(#accent-grad)" opacity="0.75" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="440" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#fcd34d" text-anchor="middle" letter-spacing="4">SHWEVOICE</text>
</svg>
